<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/vendor-map.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Petrona:wght@300;400;500;600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</helmet>

<div style="font-family:Figtree, system-ui, sans-serif">
  <div style="{{ spacerStyle }}"></div>
  <header ref="{{ headerRef }}" style="position:fixed; top:0; left:0; right:0; z-index:200; background:rgba(252,250,246,0.94); backdrop-filter:blur(14px); border-bottom:1px solid rgba(29,55,48,0.10)">
    <div style="max-width:1320px; margin:0 auto; padding:11px clamp(16px,4vw,48px); display:flex; align-items:center; gap:clamp(14px,3vw,34px); justify-content:space-between">
      <a href="/" style="display:block; flex:0 0 auto; text-decoration:none">
        <img src="assets/kosipark-logo.png" alt="Kosciuszko Tourist Park" style="height:clamp(38px,4.6vw,48px); width:auto; display:block" />
      </a>
      <nav style="{{ navStyle }}">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="{{ l.style }}">{{ l.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex; align-items:center; gap:clamp(10px,1.6vw,18px)">
        <div data-weather="sawpit-creek" title="{{ weatherTitle }}" style="{{ weatherStyle }}">
          <sc-if value="{{ isSnow }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E8A93" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"></path>
            </svg>
          </sc-if>
          <sc-if value="{{ isSun }}" hint-placeholder-val="{{ true }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#96592A" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4.4"></circle>
              <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"></path>
            </svg>
          </sc-if>
          <sc-if value="{{ isNight }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5E6E7A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z"></path>
            </svg>
          </sc-if>
          <sc-if value="{{ isRain }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E8A93" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M6.8 14.6h10.4a3.5 3.5 0 0 0 0-7 5.3 5.3 0 0 0-10.2 1.1 3 3 0 0 0-.2 5.9Z"></path>
              <path d="M9 18.4l-.7 2M13 18.4l-.7 2M17 18.4l-.7 2"></path>
            </svg>
          </sc-if>
          <sc-if value="{{ isCloud }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#74836A" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M6.5 17.5h11a3.8 3.8 0 0 0 0-7.6 5.6 5.6 0 0 0-10.8 1.2 3.2 3.2 0 0 0-.2 6.4Z"></path>
            </svg>
          </sc-if>
          <span style="font:600 13.5px/1 Figtree, sans-serif; color:#1D3730; letter-spacing:.01em">{{ tempLabel }}</span>
          <span style="{{ weatherPlaceStyle }}">{{ weatherPlace }}</span>
        </div>
        <a href="tel:0264562224" style="{{ phoneStyle }}">02 6456 2224</a>
        <a href="{{ bookHref }}" style="display:flex;align-items:center;border-radius:999px;background:#1D3730;color:#FCFAF6;padding:14px 20px;text-decoration:none;font:700 11.5px/1 Figtree,sans-serif;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap">Book online</a>
        <button type="button" onClick="{{ toggleMenu }}" style="{{ menuBtnStyle }}" aria-label="Menu">
          <span style="display:block; width:18px; height:1.5px; background:#1D3730"></span>
          <span style="display:block; width:18px; height:1.5px; background:#1D3730"></span>
        </button>
      </div>
    </div>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div style="border-top:1px solid rgba(29,55,48,0.10); padding:8px clamp(16px,4vw,48px) 22px; display:flex; flex-direction:column; background:#FCFAF6">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" onClick="{{ closeMenu }}" style="font:400 21px/1 Petrona, Georgia, serif; color:#1D3730; padding:15px 0; border-bottom:1px solid rgba(29,55,48,0.08)">{{ l.label }}</a>
        </sc-for>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0 0">
          <a href="tel:0264562224" style="font:600 12px/1 Figtree, sans-serif; letter-spacing:.12em; text-transform:uppercase; color:#74836A">Call 02 6456 2224</a>
          <span style="font:600 12px/1 Figtree, sans-serif; letter-spacing:.06em; color:#1D3730">{{ tempLabel }} · Sawpit Creek</span>
        </div>
      </div>
    </sc-if>
  </header>

  <div style="{{ stickyStyle }}">
    <a href="tel:0264562224" style="display:flex; flex-direction:column; gap:3px; min-width:0; text-decoration:none">
      <span style="font:700 9px/1 Figtree, sans-serif; letter-spacing:.18em; text-transform:uppercase; color:#A9B995">Sawpit Creek · Jindabyne</span>
      <span style="font:500 14px/1.2 Figtree, sans-serif; color:#FCFAF6">02 6456 2224</span>
    </a>
    <a href="{{ bookHref }}" style="background:#96592A; color:#FCFAF6; font:700 13px/1 Figtree, sans-serif; letter-spacing:.08em; text-transform:uppercase; padding:16px 22px; border-radius:999px; white-space:nowrap">Book Now</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:200},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;stay&quot;,&quot;availability&quot;,&quot;do&quot;,&quot;gallery&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bookHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/#book&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stickyBookBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;liveWeather&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Weather&quot;},&quot;temperature&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:-20,&quot;max&quot;:45,&quot;unit&quot;:&quot;°C&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Weather&quot;},&quot;weather&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sun&quot;,&quot;cloud&quot;,&quot;rain&quot;,&quot;snow&quot;],&quot;default&quot;:&quot;sun&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Weather&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false, w: typeof window !== "undefined" ? window.innerWidth : 1200, barH: 76, liveTemp: null, liveCond: null, liveAt: 0 };

  /** Fallback only: real sunrise/sunset when we have them, a conservative window otherwise. */
  static daylightFrom(daily) {
    try {
      const rise = new Date(daily.sunrise[0]).getTime();
      const set = new Date(daily.sunset[0]).getTime();
      const now = Date.now();
      if (rise && set) return now >= rise && now < set;
    } catch (e) {}
    const h = new Date().getHours();
    return h >= 7 && h < 17;
  }

  static codeToCondition(c, isDay) {
    // Night wins over the daytime icon for anything that isn't obviously
    // weather: a clear or lightly-clouded sky at 2am is a moon, not a sun.
    if (c === 0 || c === 1 || c === 2) return isDay === false ? "night" : "sun";
    if ([71, 73, 75, 77, 85, 86].indexOf(c) > -1) return "snow";
    if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].indexOf(c) > -1) return "rain";
    return "cloud";
  }

  async loadWeather() {
    if (this.props.liveWeather === false) return;
    // v3: cache the raw reading and its timestamp, never the derived icon —
    // day turns to night inside a cache window, and a stale reading must be
    // re-derived against the clock rather than replayed.
    const KEY = "kosipark-weather-sawpit-v3";
    const settle = (t, code, day, ts) => {
      // is_day is a snapshot. If the cached reading has aged, trust the park's
      // own sunrise/sunset over the flag that was true when it was fetched.
      const stillDay = Date.now() - ts > 600000 ? Component.daylightNow() : day;
      this.setState({ liveTemp: t, liveCond: Component.codeToCondition(code, stillDay), liveAt: ts });
    };
    try {
      const cached = JSON.parse(localStorage.getItem(KEY) || "null");
      if (cached && Date.now() - cached.ts < 1800000 && typeof cached.code === "number") {
        settle(cached.t, cached.code, cached.day, cached.ts);
        if (Date.now() - cached.ts < 900000) return;   // fresh enough; don't refetch
      }
    } catch (e) {}
    try {
      // Kosciuszko Tourist Park, 1400 Kosciuszko Road, Sawpit Creek — the park
      // itself, not Jindabyne 20km down the hill and 200m lower. No elevation
      // parameter: open-meteo already downscales to the 90m terrain height at
      // these coordinates, and overriding it with a guess would be worse.
      const url = "https://api.open-meteo.com/v1/forecast?latitude=-36.3517&longitude=148.5635" +
                  "&current=temperature_2m,weather_code,is_day&daily=sunrise,sunset" +
                  "&timezone=Australia%2FSydney&forecast_days=1";
      const r = await fetch(url);
      if (!r.ok) return;                 // pill stays hidden rather than inventing a reading
      const d = await r.json();
      const t = Math.round(d.current.temperature_2m);
      const code = d.current.weather_code;
      const day = d.current.is_day === undefined
        ? Component.daylightFrom(d.daily)
        : d.current.is_day === 1;
      if (d.daily && d.daily.sunrise) Component.rememberDaylight(d.daily);
      const ts = Date.now();
      settle(t, code, day, ts);
      try { localStorage.setItem(KEY, JSON.stringify({ t, code, day, ts })); } catch (e) {}
    } catch (e) {}
  }

  /** Keep the park's real sunrise/sunset so a stale reading can still tell day from night. */
  static rememberDaylight(daily) {
    try {
      localStorage.setItem("kosipark-daylight", JSON.stringify({
        rise: new Date(daily.sunrise[0]).getTime(),
        set: new Date(daily.sunset[0]).getTime()
      }));
    } catch (e) {}
  }

  static daylightNow() {
    try {
      const d = JSON.parse(localStorage.getItem("kosipark-daylight") || "null");
      const now = Date.now();
      // Only trust it on the day it was recorded for.
      if (d && d.rise && d.set && Math.abs(now - d.rise) < 86400000) return now >= d.rise && now < d.set;
    } catch (e) {}
    // Last resort: the park's own clock, not the guest's. Someone booking from
    // London must not see a Sawpit Creek moon at Sawpit Creek noon.
    try {
      const h = Number(new Intl.DateTimeFormat("en-AU", {
        timeZone: "Australia/Sydney", hour: "numeric", hour12: false
      }).format(new Date()));
      return h >= 7 && h < 18;
    } catch (e) {}
    const h = new Date().getHours();
    return h >= 7 && h < 18;
  }
  headerRef = React.createRef();

  measure() {
    const el = this.headerRef.current;
    if (!el) return;
    const first = el.firstElementChild;
    const h = Math.round((first || el).getBoundingClientRect().height);
    if (h && h !== this.state.barH) this.setState({ barH: h });
  }

  componentDidMount() {
    this._onResize = () => { this.setState({ w: window.innerWidth }); this.measure(); };
    window.addEventListener("resize", this._onResize);
    this.measure();
    setTimeout(() => this.measure(), 300);
    this.loadWeather();
    this._wt = setInterval(() => this.loadWeather(), 900000);
  }
  componentDidUpdate() { this.measure(); }
  componentWillUnmount() {
    window.removeEventListener("resize", this._onResize);
    clearInterval(this._wt);
  }

  renderVals() {
    const w = this.state.w;
    const narrow = w < 1180;
    const s = this.state;
    // The pill used to fall back to a sun and 4°C whenever the reading hadn't
    // landed — which is every first paint, and forever if the call fails. That
    // is how a bright sun ended up over Sawpit Creek at two in the morning.
    // There is no default now: no live reading, no pill. The props are still
    // honoured in the design canvas, where there is nothing live to read.
    const canvas = this.props.liveWeather === false;
    const cond = canvas ? (this.props.weather || "sun") : s.liveCond;
    const temp = canvas ? (this.props.temperature ?? 4) : s.liveTemp;
    const haveWeather = cond != null && temp != null;
    const active = this.props.active || "home";
    const defs = [
      { key: "home", label: "Home", href: "/" },
      { key: "stay", label: "Accommodation", href: "/accommodation" },
      { key: "availability", label: "Availability", href: "/availability" },
      { key: "do", label: "Attractions", href: "/attractions" },
      { key: "gallery", label: "Gallery", href: "/gallery" },
      { key: "contact", label: "Contact & Map", href: "/contact" }
    ];
    return {
      links: defs.map(d => ({
        label: d.label,
        href: d.href,
        style: "font:500 13.5px/1 Figtree, sans-serif; letter-spacing:.01em; white-space:nowrap; padding-bottom:4px; " +
          (d.key === active ? "color:#1D3730; border-bottom:1.5px solid #96592A" : "color:#56534C; border-bottom:1.5px solid transparent")
      })),
      // A compact temperature + icon fits beside the booking link on normal phones;
      // only the 320px edge case drops it. The place label still disappears
      // first, so the header never crowds or wraps.
      weatherStyle: (!haveWeather || w < 360)
        ? "display:none"
        : "display:flex; align-items:center; gap:7px; padding:0 2px",
      // Says where the reading is from, so it reads as the park's own weather
      // rather than a decorative number. Dropped first when the bar tightens.
      weatherPlace: "Sawpit Creek",
      weatherPlaceStyle: w < 1240
        ? "display:none"
        : "font:600 9px/1 Figtree, sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#74836A; white-space:nowrap",
      weatherTitle: haveWeather && !canvas
        ? "Live conditions at Sawpit Creek, Kosciuszko National Park" +
          (s.liveAt ? " — read " + new Date(s.liveAt).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" }) : "")
        : "",
      isSun: cond === "sun",
      isNight: cond === "night",
      isSnow: cond === "snow",
      isCloud: cond === "cloud",
      isRain: cond === "rain",
      tempLabel: haveWeather ? Math.round(temp) + "°C" : "",
      headerRef: this.headerRef,
      spacerStyle: "height:" + this.state.barH + "px",
      bookHref: this.props.bookHref || "/#book",
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(p => ({ menuOpen: !p.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      taglineStyle: w < 560
        ? "display:none"
        : "font:600 9.5px/1.5 Figtree, sans-serif; letter-spacing:.18em; text-transform:uppercase; color:#74836A; padding-left:14px; border-left:1px solid rgba(29,55,48,0.14)",
      navStyle: narrow ? "display:none" : "display:flex; align-items:center; gap:clamp(16px,2vw,26px); flex:1 1 auto; justify-content:center",
      phoneStyle: w < 1320 ? "display:none" : "font:500 13.5px/1 Figtree, sans-serif; letter-spacing:.01em; color:#56534C; white-space:nowrap; padding:8px 0",
      menuBtnStyle: narrow
        ? "display:flex; flex-direction:column; justify-content:center; gap:5px; align-items:center; width:46px; height:46px; border-radius:12px; border:1px solid rgba(29,55,48,0.18); background:transparent; cursor:pointer"
        : "display:none",
      stickyStyle: (narrow && (this.props.stickyBookBar ?? true))
        ? "position:fixed; z-index:190; left:10px; right:10px; bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 10px 10px 18px; border-radius:999px; background:rgba(18,39,32,0.96); backdrop-filter:blur(12px); box-shadow:0 16px 40px -14px rgba(18,39,32,0.7)"
        : "display:none"
    };
  }
}

</script>
</body>
</html>
