openapi: 3.1.0
x-stoplight:
  id: 7e3oqousn0w5z
info:
  title: Booking Engine API
  version: '2.0'
  description: |-
    This API allows 3rd parties to become a sales channel for GuestPoint.

    Only endpoints available to 3rd-party channels are documented here. Every request must be authenticated with the `X-API-KEY` header (a partner backend key or a session key generated from it).

    All property-scoped endpoints live under `/properties/{propertyId}/...`, where `propertyId` is the GuestPoint property id.

    ### Response envelope
    Successful responses are wrapped:
    ```json
    { "success": true, "data": { ... }, "traceId": "01HAM2Z9R2..." }
    ```
    Errors are returned as:
    ```json
    { "success": false, "message": "Human readable reason" }
    ```
    Some validation errors return a list instead:
    ```json
    { "success": false, "messages": ["reason one", "reason two"] }
    ```

    ### Value formats
    - Monetary amounts are returned as **strings** (e.g. `"337.5"`) to preserve
      decimal precision.
    - Dates are `YYYY-MM-DD` strings; timestamps are RFC3339 strings. - Rates are in the currency of the Property. Use the Exchange Rate endpoint
      to convert for display.
  contact:
    name: Chris Curtis
servers:
  - url: 'http://beapi.guestpoint.dev/api/v1'
security:
  - ApiKey: []
tags:
  - name: Start Here
    description: A very good place to start
  - name: Currency
    description: Currency information endpoints
  - name: Booking
    description: 'Availability, rates and reservation booking endpoints'
  - name: Reservation Management
    description: Retrieve and modify existing reservations
paths:
  /ping:
    get:
      summary: Ping Check
      tags:
        - Start Here
      operationId: get-ping
      x-stoplight:
        id: l4u6l2jyu2fi6
      description: |-
        Ping is a good place to start with integrations as it is a very simple call. It can be used to test connectivity.

        The `X-API-KEY` header must be set even for this function. The partner's backend key or a session key generated by the partner's key can be used.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PingOutput'
                  traceId:
                    type: string
              examples:
                Example 1:
                  value:
                    success: true
                    data:
                      Version: 0.1.0
                      Message: pong
                    traceId: 01KYKRZWPFHNM1GZ2G4A16B4V7
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ssnkey:
    post:
      summary: Create Session Key
      tags:
        - Start Here
      operationId: post-ssnkey
      x-stoplight:
        id: 0y9w5ba96qw9l
      description: |-
        Create a time-limited session key for a property (or eventually for a property group) using the partner key.

        The property must be joined to the partner channel before this can be successful. Session keys are intended for front-end/kiosk clients that should not hold the partner backend key directly.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionKeyInput'
            examples:
              Example 1:
                value:
                  PropertyId: b073cbae-3de7-4f85-b4f9-babad03ae601
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SessionKeyOutput'
                  traceId:
                    type: string
              examples:
                Example 1:
                  value:
                    success: true
                    data:
                      Key: 9TIhR7Gvl5DTpCosCbVEvQIN1Bz9s9quxEC0Irg2
                      Expiry: '2026-07-28T08:10:57.092992971Z'
                      PropertyId: b073cbae-3de7-4f85-b4f9-babad03ae601
                    traceId: 01KYKRZX22HY9DK4MJD2HF4WD6
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /properties:
    get:
      summary: List Joined Properties
      tags:
        - Start Here
      operationId: get-properties
      x-stoplight:
        id: hh8m6r0v4kqz1
      description: Returns the list of properties that have joined the partner channel associated with the API key. Use these property ids for all property-scoped endpoints.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type:
                      - array
                      - 'null'
                    items:
                      $ref: '#/components/schemas/PropertyListItem'
                  traceId:
                    type: string
              examples:
                Example 1:
                  value:
                    success: true
                    data:
                      - Id: b073cbae-3de7-4f85-b4f9-babad03ae601
                        Name: Admiral Motor Lodge
                        Timezone: Australia/Brisbane
                        CurrencyCode: AUD
                        CountryCode: AU
                        Website: 'https://www.example.com'
                    traceId: 01KYKRZX3X14A4CQGTT3RBKBAC
        '401':
          $ref: '#/components/responses/Unauthorized'
  /currencies:
    get:
      summary: Get Currency List
      tags:
        - Currency
      operationId: get-currencies
      x-stoplight:
        id: xmdclkwxygw16
      description: Get the list of currencies for which the booking engine can display approximate prices. The response includes the currency symbol and the current exchange rate relative to AUD.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      Currencies:
                        type: array
                        items:
                          $ref: '#/components/schemas/Currency'
                  traceId:
                    type: string
              examples:
                Example 1:
                  value:
                    success: true
                    data:
                      Currencies:
                        - Code: AUD
                          Name: Australian dollar
                          Symbol: $
                          Rate: '1'
                          DecimalPlaces: 2
                          LastRateUpdate: '2026-07-27T11:11:03.464972Z'
                        - Code: EUR
                          Name: Euro
                          Symbol: €
                          Rate: '1.6274024272121247'
                          DecimalPlaces: 2
                          LastRateUpdate: '2026-07-27T11:11:03.328187Z'
                        - Code: GBP
                          Name: British pound
                          Symbol: £
                          Rate: '1.9020947819578113'
                          DecimalPlaces: 2
                          LastRateUpdate: '2026-07-27T11:11:03.357282Z'
                        - Code: NZD
                          Name: New Zealand dollar
                          Symbol: $
                          Rate: '0.8276828332518088'
                          DecimalPlaces: 2
                          LastRateUpdate: '2026-07-27T11:11:03.122805Z'
                    traceId: 01KYKRZWSSNVDF4CQZ526STCN9
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/currencies/{currencyCode}':
    parameters:
      - $ref: '#/components/parameters/CurrencyCode'
    get:
      summary: Get Single Currency
      tags:
        - Currency
      operationId: get-currencies-currencyCode
      x-stoplight:
        id: k45kl5wx79azx
      description: Get a single currency by its ISO-4217 code.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Currency'
                  traceId:
                    type: string
              examples:
                Example 1:
                  value:
                    success: true
                    data:
                      Code: AUD
                      Name: Australian dollar
                      Symbol: $
                      Rate: '1'
                      DecimalPlaces: 2
                      LastRateUpdate: '2026-07-27T11:11:03.464972Z'
                    traceId: 01KYKRZWW7DFXX3VYDP03PZQFG
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/exchangerates/{fromCurrency}/{toCurrency}':
    parameters:
      - schema:
          type: string
        name: fromCurrency
        in: path
        required: true
        description: The currency being converted FROM. A 3-character ISO-4217 code. Use the Get Currency List endpoint for supported codes.
      - schema:
          type: string
        name: toCurrency
        in: path
        required: true
        description: The currency being converted TO. A 3-character ISO-4217 code.
    get:
      summary: Get Exchange Rate
      tags:
        - Currency
      operationId: get-exchangerates-fromCurrency-toCurrency
      x-stoplight:
        id: ffa3hjwpeish2
      description: 'Provides the current exchange rate to convert from one currency to another. The returned object describes the *to* currency, with `Rate` set to the from→to conversion rate.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Currency'
                  traceId:
                    type: string
              examples:
                Example 1:
                  value:
                    success: true
                    data:
                      Code: GBP
                      Name: British pound
                      Symbol: £
                      Rate: '0.5257361565182929'
                      DecimalPlaces: 2
                      LastRateUpdate: '2026-07-27T11:11:03.357282Z'
                    traceId: 01KYKRZWY13GCRSA5AAHZ98FV2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/properties/{propertyId}/availabilities':
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      summary: Get Availability
      tags:
        - Booking
      operationId: get-availabilities
      x-stoplight:
        id: djtt4vbb5s6ll
      description: |-
        Get Room, Availability and Rate data for the given query parameters.

        This returns enough information to complete a booking:
         - Property information, images and messages to display
         - Room Type information and images, availability for the selected dates,
           and any urgency messaging
         - Rate Plan information and nightly rates for the selected dates,
           including a strike-through rate (the rate prior to any promo discount)
           where appropriate
         - Policy information for each rate plan


        Normally, if a room type has no availability for one of the nights, or a rate is closed or otherwise unsuitable due to restrictions, that room type or rate is omitted, so **only sellable data is returned**.

        If `calendarMode=true` is supplied, unsellable data is also returned and the client must handle it (for example, a calendar showing unsellable dates).
        Rates are returned in the currency of the Property. Use the Get Exchange Rate endpoint to get an exchange rate to apply when displaying rates in the local currency.
        Images may be omitted if they are of no interest.
        An array of properties is returned to support future functionality, even though a single property is currently returned.
      parameters:
        - schema:
            type: string
          in: query
          name: arrivalDate
          description: Date of arrival (YYYY-MM-DD).
          required: true
        - schema:
            type: string
          in: query
          name: departureDate
          description: Date of departure (YYYY-MM-DD). Must be after arrivalDate.
          required: true
        - schema:
            type: integer
          in: query
          name: numAdults
          description: Number of adults. Must be greater than 0.
          required: true
        - schema:
            type: integer
          in: query
          name: numChildren
          description: Number of children. Defaults to 0.
        - schema:
            type: boolean
          in: query
          name: calendarMode
          description: Include dates with no availability or closed rates.
        - schema:
            type: string
          in: query
          name: promoCode
          description: Promotion code.
        - schema:
            type: string
          in: query
          name: roomTypes
          description: Comma-separated list of room-type external ids to filter to.
        - schema:
            type: string
          in: query
          name: ratePlans
          description: Comma-separated list of rate-plan external ids to filter to.
        - schema:
            type: string
          in: query
          name: propertyGroupId
          description: Property group id. Only required when calling the group-scoped variant of this endpoint without a propertyId.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InventoryOutput'
                  traceId:
                    type: string
              examples:
                Example 1:
                  $ref: '#/components/examples/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/properties/{propertyId}/bestavailablerates':
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      summary: Get Best Available Rates
      tags:
        - Booking
      operationId: get-bestavailablerates
      x-stoplight:
        id: 7p2m0c4x8n1kd
      description: 'Returns the best available rate per day across a date range, suitable for driving calendar widgets. Each property entry contains a `Days` map keyed by date.'
      parameters:
        - schema:
            type: string
          in: query
          name: fromDate
          description: Start of the range (YYYY-MM-DD).
          required: true
        - schema:
            type: string
          in: query
          name: toDate
          description: End of the range (YYYY-MM-DD). Must be after fromDate; maximum range is 365 nights.
          required: true
        - schema:
            type: string
          in: query
          name: roomType
          description: Restrict to a single room-type external id.
        - schema:
            type: string
          in: query
          name: promoCode
          description: Promotion code.
        - schema:
            type: integer
          in: query
          name: numAdults
          description: Number of adults.
        - schema:
            type: integer
          in: query
          name: numChildren
          description: Number of children.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BAROutput'
                  traceId:
                    type: string
              examples:
                Example 1:
                  $ref: '#/components/examples/BestAvailableRatesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/properties/{propertyId}/promocodes/{code}':
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - schema:
          type: string
        name: code
        in: path
        required: true
        description: The promo code to validate.
    get:
      summary: Validate Promo Code
      tags:
        - Booking
      operationId: get-promocode
      x-stoplight:
        id: 2q9w7e5r3t1yv
      description: Check whether a promo code is valid for the property. Returns an array of matching promotions (a single code may resolve to more than one applicable promotion).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingEnginePromoOutput'
                  traceId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/properties/{propertyId}/extras':
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    post:
      summary: Get Eligible Extras
      tags:
        - Booking
      operationId: post-extras
      x-stoplight:
        id: 5f8g2h6j4k0lb
      description: Returns the extras (add-ons) that are eligible for the supplied room stays. Called for the guest-details step after room stays have been selected.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingExtraInput'
            examples:
              Example 1:
                summary: The selected room stay
                description: 'Only the dates, room type and rate plan of each room stay are needed to work out which extras are on offer.'
                value:
                  RoomStays:
                    - Arrival: '2026-08-13'
                      Departure: '2026-08-14'
                      RoomTypeId: 3d75eb32-9f15-43e4-a451-d79b8490ca45
                      RatePlanId: e3c6aefc-45f4-4050-a85f-640995c61f73
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingExtraOutput'
                  traceId:
                    type: string
              examples:
                Example 1:
                  summary: Three of the extras on offer
                  description: 'Send the ones the booker chooses back on the room stay as `Extras`, using the `Id` here and one `Counts` entry per price. A `perRoom`, `perNight` or `perBooking` extra has a single unnamed price, so it takes a single count.'
                  value:
                    success: true
                    data:
                      - Id: 6ea13f98-64a5-4d25-bb3c-58ed9b9b29c8
                        Name: Buffet Style Dinner
                        Description: Dinner in the restaurant each night of the stay
                        ExtraType: checkout
                        CheckoutType: service
                        MaxItems: 1
                        PriceType: perPersonPerNight
                        DisplayOrder: 0
                        Images: null
                        Prices:
                          - Id: 0
                            Name: Adult
                            Price: '39'
                          - Id: 1
                            Name: Child
                            Price: '19'
                        RatePlans:
                          - e3c6aefc-45f4-4050-a85f-640995c61f73
                      - Id: d35f19b5-fc44-4835-bf5e-06d358b7e8ac
                        Name: Bike Hire
                        Description: Bike Hire. Per person. Enter number of adults and Children requiring bicycles.
                        ExtraType: checkout
                        CheckoutType: quantity
                        MaxItems: 0
                        PriceType: perPerson
                        DisplayOrder: 0
                        Images:
                          - URL: 'https://images.guestpoint.com/dev-images/b073cbae-3de7-4f85-b4f9-babad03ae601/AddonPhoto/BikeHire.png'
                            Captions:
                              en-AU: ''
                            Sequence: '0'
                        Prices:
                          - Id: 0
                            Name: Adult
                            Price: '17'
                          - Id: 1
                            Name: Child
                            Price: '12'
                        RatePlans:
                          - e3c6aefc-45f4-4050-a85f-640995c61f73
                      - Id: 10cf57ab-2292-4a09-bee9-cab4cd638918
                        Name: Champagne on Arrival
                        Description: Lovely chilled bottle of Veuve Cliquot NV
                        ExtraType: checkout
                        CheckoutType: quantity
                        MaxItems: 0
                        PriceType: perRoom
                        DisplayOrder: 0
                        Images:
                          - URL: 'https://images.guestpoint.com/dev-images/b073cbae-3de7-4f85-b4f9-babad03ae601/AddonPhoto/champagne.jpg'
                            Captions:
                              en-AU: ''
                            Sequence: '0'
                        Prices:
                          - Id: 0
                            Name: ''
                            Price: '80'
                        RatePlans:
                          - e3c6aefc-45f4-4050-a85f-640995c61f73
                    traceId: 01KZFWERC42S7CEZCENG2VANJ0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/properties/{propertyId}/beprofilefields':
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      summary: Get Profile Fields
      tags:
        - Booking
      operationId: get-beprofilefields
      description: |-
        Get the profile fields the property collects in addition to the standard guest details. Use these to build your booking form, then send the answers back as `ProfileFields` - on a guest for a `person`, `company` or `both` field, and on the reservation for a `reservation` field.

        For a `lookup` field the booker must choose one of the supplied `Values`, and it is that value's `ExternalId` that is sent back.
      parameters:
        - schema:
            type: boolean
            default: false
          name: includeInactive
          in: query
          description: Include fields that are no longer in use. Off by default.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type:
                      - array
                      - 'null'
                    items:
                      $ref: '#/components/schemas/BookingEngineProfileField'
                  traceId:
                    type: string
              examples:
                Example 1:
                  value:
                    success: true
                    data:
                      - PropertyId: b073cbae-3de7-4f85-b4f9-babad03ae601
                        ExternalId: 25fd2e0d-bb89-42a7-9185-8651a94b3bc3
                        Name: Floor Preference
                        GroupName: Preferences
                        FieldType: lookup
                        FieldScope: person
                        Values:
                          - ExternalId: d0d8e23b-952f-4123-b84c-8e9c9cabd0e4
                            Value: Ground Floor
                          - ExternalId: 3c17f4a8-6d21-4f9b-8e0a-71bd25c4f8e2
                            Value: Upper Floor
                        Sequence: 1
                        Status: Active
                      - PropertyId: b073cbae-3de7-4f85-b4f9-babad03ae601
                        ExternalId: 038d93a1-db22-45b6-9433-8f6c25017445
                        Name: Primary Reason for Stay
                        GroupName: Marketing
                        FieldType: lookup
                        FieldScope: reservation
                        Values:
                          - ExternalId: 7abd5fb5-954d-4d14-ae24-c1ce39c2d7ae
                            Value: Holiday
                          - ExternalId: b2e6c419-8f30-4a52-9c7d-1e4f83ba5d06
                            Value: Business
                        Sequence: 2
                        Status: Active
                    traceId: 01KZFQDRHPRB2HHBH2AEYZCD0B
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/properties/{propertyId}/beprofilefields/{Id}':
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - schema:
          type: string
        name: Id
        in: path
        required: true
        description: The `ExternalId` of the profile field.
    get:
      summary: Get Profile Field
      tags:
        - Booking
      operationId: get-beprofilefields-id
      description: Get a single profile field by its `ExternalId`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BookingEngineProfileField'
                  traceId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/properties/{propertyId}/reservations':
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    patch:
      summary: Validate Reservation
      tags:
        - Booking
      operationId: patch-reservations
      x-stoplight:
        id: 1fsozpd5ebqk7
      description: |-
        Validate the provided reservation to check that it can be created. If availability and restrictions are met, prices are recalculated and the validated reservation is returned, including a `VerificationCode` and payment details.

        The prices calculated here should be displayed to the booker and used for payment. Any prices sent by the client are ignored when saving a booking.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInput'
            examples:
              Booked by one of the guests:
                summary: 'One room, one guest, no separate booking contact'
                description: '`BookingContact` is omitted, so the first guest is used as the booking contact. Every guest carries an `ID`, and the room stay points at it with `GuestId`.'
                value:
                  TraceId: 01KZ4P3NBNHYP36B8N1X83AYMM
                  PropertyId: b073cbae-3de7-4f85-b4f9-babad03ae601
                  Status: Booked
                  ExtraInfo: Feather Pillow please
                  Adults: 1
                  Children: 0
                  Infants: 0
                  ConsentGiven: null
                  PromoCode: ''
                  EstimatedArrival: '11:30'
                  RoomStays:
                    - Arrival: '2026-08-13'
                      Departure: '2026-08-14'
                      RoomTypeId: 7aea26b1-2585-4dd4-87cf-ea41a742f719
                      RatePlanId: 34b76b4c-47a1-42bd-9755-f2ea9c076572
                      Adults: 1
                      Children: 0
                      Infants: 0
                      GuestId: 28bc36af-a27d-49f2-83b0-b84fddb74efd
                      GuestName: Buddy Holly
                      ExtraInfo: Feather Pillow please
                      Extras:
                        - Id: 10cf57ab-2292-4a09-bee9-cab4cd638918
                          Name: Champagne on Arrival
                          Counts:
                            - Id: 0
                              Name: Adult
                              Count: 1
                            - Id: 1
                              Name: Child
                              Count: 0
                  Guests:
                    - ID: 28bc36af-a27d-49f2-83b0-b84fddb74efd
                      FirstName: Buddy
                      LastName: Holly
                      Email: buddy.holly@example.com
                      Phone: '+61444444444'
