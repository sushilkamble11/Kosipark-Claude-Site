        CardExpiry:
          type: string
          description: Format mm/yy.
    BookingEngineProfileField:
      type: object
      title: BookingEngineProfileField
      description: The definition of an additional field the property collects. Retrieved from Get Profile Fields; answers are sent back as `ReservationProfileField`.
      required:
        - ExternalId
        - Name
        - FieldType
        - FieldScope
      properties:
        PropertyId:
          type: string
        ExternalId:
          type: string
          description: Send this as the `Id` of the answer.
        Name:
          type: string
        GroupName:
          type: string
          description: Used to group related fields together for display.
        FieldType:
          type: string
          description: Determines what the answer may contain.
          enum:
            - text
            - notes
            - lookup
            - number
            - decimal
            - currency
            - percentage
            - checkbox
            - date
        FieldScope:
          type: string
          description: 'Where the answer belongs. `person`, `company` and `both` are asked of a guest and returned in that guest''s `ProfileFields`; `reservation` is asked once and returned in the reservation''s `ProfileFields`.'
          enum:
            - person
            - company
            - both
            - reservation
        Values:
          type:
            - array
            - 'null'
          description: The options to choose from. Only set for a `lookup` field.
          items:
            $ref: '#/components/schemas/ProfileFieldValue'
        Sequence:
          type: integer
          description: The order in which to display the fields.
        Status:
          type: string
          enum:
            - Active
            - Inactive
    ProfileFieldValue:
      type: object
      title: ProfileFieldValue
      properties:
        ExternalId:
          type: string
          description: Send this as the `Value` of the answer.
        Value:
          type: string
          description: The text to display to the booker.
    ReservationProfileField:
      type: object
      title: ReservationProfileField
      description: An answer to one of the property's profile fields.
      properties:
        Id:
          type: string
          description: The `ExternalId` of the profile field being answered.
        Name:
          type: string
        Type:
          type: string
          description: The `FieldType` of the profile field being answered.
        Value:
          type: string
          description: 'For a `lookup` field this is the `ExternalId` of the chosen `ProfileFieldValue`, otherwise the answer itself.'
