        ClosedToArrival:
          type: string
          description: Default closed to arrival restriction
        ClosedToDeparture:
          type: string
          description: Default closed to departure restriction
        DefaultRate:
          type: string
          description: Default rate for this rate plan
        IncludedGuests:
          type: integer
        ExtraAdultRate:
          type: string
        ExtraChildRate:
          type: string
        Meta:
          type: object
          properties:
            TraceId:
              type: string
  securitySchemes:
