                      - Id: 4359a639-4f69-48e7-9f82-6d3b38dcb578
                    FromDate: '2024-06-16'
                    ToDate: '2024-06-17'
                  Rates:
                    RoomTypes:
                      - Id: 4359a639-4f69-48e7-9f82-6d3b38dcb578
                    RatePlans:
                      - Id: 7aeadcdc-c9cf-458f-8417-9d0002899d24
                    FromDate: '2024-06-16'
                    ToDate: '2024-06-17'
      description: Specifies the data to be sent to the channel
