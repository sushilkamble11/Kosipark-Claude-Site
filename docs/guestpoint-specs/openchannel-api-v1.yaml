    RoomType-Request:
      type: object
      description: Room type details sent from GuestPoint to your system
      required:
        - PropertyId
        - RoomTypeId
        - Name
      properties:
        PropertyId:
          type: string
          description: Your property ID as returned in the POST /properties response
        RoomTypeId:
          type: string
          description: GuestPoint's UUID for this room type
        Name:
          type: string
        Description:
          type: string
        MaxGuests:
          type: integer
        IncludedGuests:
          type: integer
        Classification:
          type: string
          description: 'Property-specific room classification code, eg Standard, Deluxe'
