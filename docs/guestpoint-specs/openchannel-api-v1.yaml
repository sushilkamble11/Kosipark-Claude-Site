              x-stoplight:
                id: nbefzrtshgbt5
              description: Not generally required
            Cvv:
              type: string
              x-stoplight:
                id: byv0wdbtqkrsa
              description: Not generally required
            CardExpiry:
              type: string
              x-stoplight:
                id: jyrf7y079keqq
