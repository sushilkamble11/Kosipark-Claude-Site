openapi: 3.1.0
x-stoplight:
  id: zlxgw1p35e0z0
info:
  title: OpenChannel Connection
  version: '1.0'
  description: "The OpenChannel API allows third parties such as Sales Channels, Channel Managers and Revenue Managers connect to the GuestPoint PMS.\r\n\r\nAt its core, the API sends Rates and Availability updates and receives bookings via either push or pull mechanisms.\r\n\r\nThere are also endpoints for retrieval of information to enable mapping and for initial population of room types and rate plans.\r\n\r\nWhen creating the integration, GuestPoint requires some information:\r\n   - Your base url, eg https://api.myname.com\r\n   - The authentication scheme you will use to protect access to your server when GuestPoint calls your endpoints. It can be one of Basic Auth, Bearer Token or X-API-KEY. You must provide the Username & password for Basic Auth or the token for the other schemes.\r\n\r\nCalls to GuestPoint's OpenChannel API endpoints require use of the X-API-KEY header.\r\n\r\nGuestPoint includes an x-property-id header (your property ID) and an x-payload-type header on all calls to your server.\r\n\r\nContact GuestPoint to discuss your integration requirements and get an API Key.\r\n"
  contact:
    name: Integrations Support
    email: integrations@guestpoint.com
  summary: 'An API for both inbound messages from, and outbound messages to Sales Channels, Channel Managers and Revenue Managers'
servers:
  - url: 'https://ocapi.guestpoint.dev'
security:
  - apiKey: []
paths:
  /ping:
    get:
      summary: Ping Check
      tags:
        - Start Here
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    data:
                      Message: pong
                      Version: 1.1.0
                    success: true
                    traceId: 01HAM2Z9R2MDWRYW5XSSSEC6RK
                properties:
                  Data:
                    type: object
                    x-stoplight:
                      id: 30xd3l766aluu
                    properties:
                      Message:
                        type: string
                      Version:
                        type: string
                  Success:
                    type: boolean
                    x-stoplight:
                      id: iptckh5sox5lu
                  TraceId:
                    type: string
                    x-stoplight:
                      id: lyrqou37ps3j8
              examples:
                Example 1:
                  value:
                    Data:
                      Version: 0.0.1
                      Message: pong
                    Success: true
                    TraceId: 01HR3T7FHQAXHMG6H126DZCSBG
      operationId: get-ping
      x-stoplight:
        id: 7drawiwzp2muo
      description: "Ping is a good place to start with integrations as it is a very simple call.\r\nIt can be used to test connectivity.\r\n\r\nThe x-api-key header must be set even for this function. The partner's backend key or a session key generated by the partner's key can be used."
  /properties:
    get:
      summary: Get Connected Properties
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - success
                properties:
                  Data:
                    x-stoplight:
                      id: gyk8w9sjv7ez0
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
                      x-stoplight:
                        id: qboa3dq48fkbm
                  success:
                    type: boolean
                    x-stoplight:
                      id: z63gbphl7oqv1
                  traceId:
                    type: string
                    x-stoplight:
                      id: x3plqfger9i6r
              examples:
                Example 1:
                  value:
                    data:
                      - ID: 1ed82509-b260-613f-8bbd-edd06b16e222
                        Name: Hilltops Retreat Motor Inn
                        Description: 'Relaxed roadside lodging offering an outdoor saltwater pool, a restaurant & a bar, plus free Wi-Fi.'
                        CurrencyCode: AUD
                        Timezone: Australia/Sydney
                        FormattedAddress: '4662 Olympic Hwy, Young, NSW 2594'
                        StreetAddress:
                          Line1: 4662 Olympic Hwy
                          Line2: ''
                          City: Young
                          PostalCode: '2594'
                          StateProvince: NSW
                        CountryCode: AU
                        Country: Australia
                        NumberOfRooms: 11
                        Status: Active
                        PropertyTypeCode: '27'
                        Latitude: '-34.3346626'
                        Longitude: '148.2850907'
                        Contacts:
                          Business:
                            Name: The Manager
                            Phone: '+61555555555'
                            Mobile: ''
                            email: fake@fakehotel.com
                          Reservations:
                            Name: The Manager
                            Phone: '+61555555555'
                            Mobile: ''
                            email: fake@fakehotel.com
                          Owner: null
                          Manager: null
                          Admin: null
                    success: true
                    traceId: string
      operationId: get-properties
      x-stoplight:
        id: 2oa7ky9sluur9
      description: Channel can retrieve the list of connected properties.
      tags:
        - Data requested by you
    post:
      summary: Create Property
      responses:
        '200':
          $ref: '#/components/responses/AddChange-Property-Response'
      operationId: post-properties
      description: "GuestPoint will call this endpoint to create a property in your system when a new connection is made.\r\n\r\nThe PropertyId you return in the response will be used in all subsequent communications for this property. If you want to use GuestPoint's IDs, simply return the PropertyId from the request."
      tags:
        - Data sent to you
      x-stoplight:
        id: e0llgdg0117m2
      requestBody:
        $ref: '#/components/requestBodies/AddChange-Property-Request'
  '/properties/{propertyId}':
    parameters:
      - schema:
          type: string
        name: propertyId
        in: path
        required: true
    get:
      summary: Get Property Details
      tags:
        - Data requested by you
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    $ref: '#/components/schemas/Property'
                    x-stoplight:
                      id: cbv381cc98ycg
                  Success:
                    type: boolean
                    x-stoplight:
                      id: zr89k3r6jej8i
                  TraceId:
                    type: string
                    x-stoplight:
                      id: kqhuvfr56s4lg
              examples:
                Example 1:
                  value:
                    Data:
                      ID: '12345'
                      Name: City Retreat Motor Inn
                      Description: 'Relaxed roadside lodging offering an outdoor saltwater pool, a restaurant & a bar, plus free Wi-Fi.'
                      CurrencyCode: AUD
                      Timezone: Australia/Sydney
                      FormattedAddress: 'Olympic Hwy, Young, NSW 2594'
                      StreetAddress:
                        Line1: Olympic Hwy
                        Line2: ''
                        City: Young
                        PostalCode: '2594'
                        StateProvince: NSW
                      CountryCode: AU
                      Country: Australia
                      NumberOfRooms: 11
                      Status: Active
                      PropertyTypeCode: '27'
                      Latitude: '-34.3346626'
                      Longitude: '148.2850907'
                      Contacts:
                        Business:
                          Name: The Manager
                          Phone: '+61555555555'
                          Mobile: ''
                          email: demo@demohotel.com
                        Reservations:
                          Name: The Manager
                          Phone: '+61555555555'
                          Mobile: ''
                          email: demo@demohotel.com
                        Owner: null
                        Manager: null
                        Admin: null
                    Success: true
                    TraceId: string
      operationId: get-properties-propertyId
      x-stoplight:
        id: ni6a5ekwl7y7c
      description: Get the details of the property with the requested Id.
    put:
      summary: Update Property Details
      tags:
        - Data sent to you
      responses:
        '200':
          $ref: '#/components/responses/AddChange-Property-Response'
      operationId: put-properties-propertyId
      x-stoplight:
        id: dgfpjyzygvacp
      description: GuestPoint will call this endpoint to update property details when changes are made in the PMS.
      requestBody:
        $ref: '#/components/requestBodies/AddChange-Property-Request'
  '/properties/{propertyId}/roomtypes':
    get:
      summary: Get Connected Property Room Types
      tags:
        - Data requested by you
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    x-stoplight:
                      id: 7xgty5g443zqh
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomType'
                      x-stoplight:
                        id: qe2yp94n2i03x
                  Success:
                    type: boolean
                    x-stoplight:
                      id: cq48pzuc0b2m4
                  TraceId:
                    type: string
                    x-stoplight:
                      id: nujsclc2ijwcz
      operationId: get-properties-propertyId-roomtypes
      x-stoplight:
        id: t2kq87w4uiqrm
      description: Channel can retrieve the list of room types for a connected property.
    parameters:
      - schema:
          type: string
        name: propertyId
        in: path
        required: true
  '/properties/{propertyId}/rateplans':
    parameters:
      - schema:
          type: string
        name: propertyId
        in: path
        required: true
    get:
      summary: Get Connected Property Rate Plans
      tags:
        - Data requested by you
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    type: array
                    x-stoplight:
                      id: uc1blbz75rwz4
                    items:
                      $ref: '#/components/schemas/RatePlan'
                      x-stoplight:
                        id: llvz90ry4syrx
                  Success:
                    type: boolean
                    x-stoplight:
                      id: djseb86h8du86
                  TraceId:
                    type: string
                    x-stoplight:
                      id: twui207zr93po
      operationId: get-properties-propertyId-rateplans
      x-stoplight:
        id: m7uj61v87fbq2
      description: Channel can retrieve the list of rate plans for a connected property.
      parameters:
        - schema:
            type: boolean
          name: all
          in: query
          description: 'If true, return all rate plans including inactive ones. Defaults to active only.'
  /properties/reservations:
    post:
      summary: Push Reservation to GuestPoint
      tags:
        - Data sent by you
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    x-stoplight:
                      id: ksg9u9xg3xmgt
                  Message:
                    type: string
                    x-stoplight:
                      id: 0m6ojd5ntq1wq
                  TraceId:
                    type: string
                    x-stoplight:
                      id: zgc9aynvowqic
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    x-stoplight:
                      id: icugt1ujypfgn
                  Message:
                    type: string
                    x-stoplight:
                      id: opvv9ufntqq0b
                  TraceId:
                    type: string
                    x-stoplight:
                      id: sxv3jr1qagq1i
              examples:
                Example 1:
                  value:
                    Success: false
                    Message: Invalid Property
                    TraceId: 01HR5SMZ12NAZM31QZVX0KAWR0
      operationId: post-properties-reservations
      x-stoplight:
        id: 12ewc1wpf7tfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
      description: "This endpoint is used to create new reservations, and to modify or cancel existing reservations.\r\n\r\nNote that we would expect that in the event that a call to this endpoint times out, receives a \"504 Gateway Timeout\" response or is unable to connect, that the send would be retried a number of times over the course of more than an hour before giving up.\r\n\r\nIf you are planning on sending Credit Card details at any stage, all reservations should be sent via a secure proxy.\r\nGuestPoint will provide the proxy URL."
    parameters: []
  /properties/reservations/payment:
    post:
      summary: Push Reservation Payment
      tags:
        - Data sent by you
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    type: object
                    properties:
                      PropertyId:
                        type: string
                      ReservationId:
                        type: string
                      ConfNum:
                        type: string
                      TransactionId:
                        type: string
                      Amount:
                        type: string
                      CurrencyCode:
                        type: string
                      PaymentType:
                        type: string
                      ChargeType:
                        type: string
                      ExtraInfo:
                        type: string
                  Success:
                    type: boolean
                  TraceId:
                    type: string
                x-examples:
                  Example 1:
                    Data:
                      PropertyId: a11681d7-c94c-4a11-b8e3-3f0856d8f93b
                      ReservationId: A1234365
                      ConfNum: A1234365
                      TransactionId: '987654321'
                      Amount: '123.2'
                      CurrencyCode: AUD
                      PaymentType: Credit Card
                      ChargeType: Room
                      ExtraInfo: Something
                    Success: true
                    TraceId: 01J19M411CZZJR6S4B95R7CCZA
              examples:
                Example 1:
                  value:
                    Data:
                      PropertyId: a11681d7-c94c-4a11-b8e3-3f0856d8f93b
                      ReservationId: A1234365
                      ConfNum: A1234365
                      TransactionId: '987654321'
                      Amount: '123.2'
                      CurrencyCode: AUD
                      PaymentType: Credit Card
                      ChargeType: Room
                      ExtraInfo: Something
                    Success: true
                    TraceId: 01J19M411CZZJR6S4B95R7CCZA
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                  Success:
                    type: boolean
                x-examples:
                  Example 1:
                    Message: Cannot find associated reservation
                    Success: false
              examples:
                Example 1:
                  value:
                    Message: Cannot find associated reservation
                    Success: false
      operationId: post-properties-reservations-payment
      x-stoplight:
        id: 1umdsyj3mwu2g
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationPayment'
      description: "Allows payment info to be sent for reservations.\r\n\r\nNote that if the identified reservation does not already exist in the system (for example the reservation was made before you connected with GuestPoint), the response will have status code 422 Unprocessable Entity.\r\n"
  '/properties/{propertyId}/rates':
    parameters:
      - schema:
          type: string
        name: propertyId
        in: path
        required: true
    post:
      summary: Set GuestPoint Rates
      tags:
        - Data sent by you
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                  Message:
                    type: string
                  TraceId:
                    type: string
              examples:
                Example 1:
                  value:
                    Success: true
                    Message: ''
                    TraceId: 01HR5SMZ12NAZM31QZVX0KAWR0
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                  Message:
                    type: string
                  TraceId:
                    type: string
      operationId: post-properties-propertyId-rates
      x-stoplight:
        id: tzkj6cijfzjrc
      description: "Update rates in GuestPoint. This is available to Revenue Management Systems only.\r\n\r\nYou can set field values to null if you do not wish to update them. For example, to change MinStayArrival only, set Rate and other restriction values to null or omit them from the payload.\r\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Set-Rate'
  '/properties/{propertyId}/sync':
    parameters:
      - schema:
          type: string
        name: propertyId
        in: path
        required: true
    post:
      summary: Request Rates & Availability Push
      tags:
        - Data requested by you
      responses:
        '202':
          description: Accepted - the sync has been queued and data will be delivered shortly via the /rates and /availabilities endpoints.
      operationId: post-properties-propertyId-sync
      x-stoplight:
        id: sbic19ota5qcm
      description: 'For requested room types/rate plans and date ranges, request that rates and/or availability data be pushed to the channel. The response is 202 Accepted; the data will be delivered asynchronously.'
      requestBody:
        $ref: '#/components/requestBodies/Sync-Request'
  /availabilities:
    post:
      summary: Update Availability
      tags:
        - Data sent to you
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    x-stoplight:
                      id: fke7dclrxj5ng
                  Message:
                    type: string
                    x-stoplight:
                      id: kayl01s15ftbk
                  TraceId:
                    type: string
                    x-stoplight:
                      id: x7ewvdopd4wrd
              examples:
                Example 1:
                  value:
                    Success: true
                    Message: ''
                    TraceId: 1ea4b61-8efe-43f7-b3fb-053f18a86c4e
      operationId: post-availabilities
      x-stoplight:
        id: qxmbuyof4lzlu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Availability-Update'
            examples: {}
      description: "Changes to availability are sent to your server.\r\nYou can REQUEST a push using the /sync endpoint for a room type and date range."
  /rates:
    post:
      summary: Update Rates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    Data:
                      Message: Rates updated for Advance Motel Lakeside
                      Warnings:
                        - 'Ignoring Element 1: Cannot find roomtype map for property (Advance Motel Lakeside) and roomtype id c3446757-51ab-4328-8349-a7abd83f7754'
                    Success: true
                    TraceId: 01JDGZTJ8AX8XVV5Y4JMFB92EY
                properties:
                  Success:
                    type: boolean
                  Message:
                    type: string
                    x-stoplight:
                      id: g6xrpfuivrv51
                  TraceId:
                    type: string
              examples: {}
      operationId: post-rates
      x-stoplight:
        id: yts44qtpzyypc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rate-Update'
            examples:
              Example 1:
                value:
                  Values:
                    - PropertyId: '12345'
                      RoomTypeId: 72e107a5-7fb9-4733-9e5c-45523822bc93
                      RatePlanId: 6d4dbb18-77a0-41b6-86b1-51c5870b596c
                      DateFrom: '2024-03-06'
                      DateTo: '2024-03-06'
                      Rate: '315'
                      CurrencyCode: AUD
                      TaxIncluded: true
                      StopSell: false
                      MinStayArrival: 1
                      ClosedToArrival: false
                      ClosedToDeparture: false
                    - PropertyId: '12345'
                      RoomTypeId: 72e107a5-7fb9-4733-9e5c-45523822bc93
                      RatePlanId: 6d4dbb18-77a0-41b6-86b1-51c5870b596c
                      DateFrom: '2024-03-07'
                      DateTo: '2024-03-07'
                      Rate: '315'
                      CurrencyCode: AUD
                      TaxIncluded: true
                      StopSell: true
                      MinStayArrival: 1
                      ClosedToArrival: false
                      ClosedToDeparture: false
                  Meta:
                    TraceId: 01HR5SMZ12NAZM31QZVX0KAWR0
      tags:
        - Data sent to you
      description: "Changes to Rates are sent to your server.\r\nYou can REQUEST a push using the /sync endpoint for a room type / rate plan combination for a date range."
  /reservations/pull:
    get:
      summary: Get Reservations
      tags:
        - Data requested from you
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    type: array
                    x-stoplight:
                      id: juvlueglm0wvw
                    items:
                      $ref: '#/components/schemas/Reservation'
                      x-stoplight:
                        id: s0w1emkkhbs3u
                  Success:
                    type: boolean
                    x-stoplight:
                      id: k3e4htmo8htqg
                  Message:
                    type: string
                    x-stoplight:
                      id: c9puonhnv4tpp
                  TraceId:
                    type: string
                    x-stoplight:
                      id: lfqrjwbsl2wis
      operationId: get-reservations-pull
      x-stoplight:
        id: esjhzqbyj64z8
      description: "Reservations can be pushed or pulled. If the Reservation Push method is implemented, this pull endpoint is optional.\r\n\r\nGuestPoint will call this endpoint on a cycle agreed with you, preferably between 30 seconds and 3 minutes.\r\nYou should respond with all undelivered reservations for all connected properties. Our preference is a maximum of 20 reservations per response.\r\n\r\nFor each reservation returned, GuestPoint will subsequently call POST /{acknowledgeId}/ack to confirm receipt."
    parameters: []
  /roomtypes:
    post:
      summary: Create Room Type
      tags:
        - Data sent to you
      responses:
        '200':
          $ref: '#/components/responses/AddChange-RoomType-Response'
      operationId: post-roomtypes
      description: "GuestPoint will call this endpoint to create a room type in your system when a room type is connected to your channel in GuestPoint.\r\n\r\nThe RoomTypeId you return in the response will be used in all subsequent rate and availability updates for this room type. If you want to use GuestPoint's IDs, simply return the RoomTypeId from the request."
      requestBody:
        $ref: '#/components/requestBodies/AddChange-RoomType-Request'
  '/roomtypes/{remoteId}':
    parameters:
      - schema:
          type: string
        name: remoteId
        in: path
        required: true
        description: Your room type ID as returned in the POST /roomtypes response
    put:
      summary: Update Room Type
      tags:
        - Data sent to you
      responses:
        '200':
          $ref: '#/components/responses/AddChange-RoomType-Response'
      operationId: put-roomtypes-remoteId
      description: GuestPoint will call this endpoint to update a room type in your system when room type details change in the PMS.
      requestBody:
        $ref: '#/components/requestBodies/AddChange-RoomType-Request'
  /rateplans:
    post:
      summary: Create Rate Plan
      tags:
        - Data sent to you
      responses:
        '200':
          $ref: '#/components/responses/AddChange-RatePlan-Response'
      operationId: post-rateplans
      description: "GuestPoint will call this endpoint to create a rate plan in your system when a rate plan is connected to your channel.\r\n\r\nThe RatePlanId you return in the response will be used in all subsequent rate updates for this rate plan. If you want to use GuestPoint's IDs, simply return the RatePlanId from the request."
      requestBody:
        $ref: '#/components/requestBodies/AddChange-RatePlan-Request'
  '/rateplans/{remoteId}':
    parameters:
      - schema:
          type: string
        name: remoteId
        in: path
        required: true
        description: Your rate plan ID as returned in the POST /rateplans response
    put:
      summary: Update Rate Plan
      tags:
        - Data sent to you
      responses:
        '200':
          $ref: '#/components/responses/AddChange-RatePlan-Response'
      operationId: put-rateplans-remoteId
      description: GuestPoint will call this endpoint to update a rate plan in your system when rate plan details change in the PMS.
      requestBody:
        $ref: '#/components/requestBodies/AddChange-RatePlan-Request'
  '/{acknowledgeId}/ack':
    parameters:
      - schema:
          type: string
        name: acknowledgeId
        in: path
        required: true
        description: The CMAcknowledgeID from the reservation as returned by GET /reservations/pull
    post:
      summary: Acknowledge Reservation
      tags:
        - Data requested from you
      responses:
        '200':
          description: OK - reservation acknowledged successfully
      operationId: post-acknowledgeId-ack
      description: "After pulling a reservation from GET /reservations/pull, GuestPoint will call this endpoint to acknowledge that the reservation was received and processed successfully.\r\n\r\nOnce acknowledged, the reservation should not be returned in future calls to GET /reservations/pull."
  /ratecodes:
    post:
      summary: Get Rate Plan Codes
      tags:
        - Data requested from you
      responses:
        '200':
          $ref: '#/components/responses/Get-RatePlanCodesResponse'
      operationId: get-ratecodes
      x-stoplight:
        id: 1rr9fbcgf6mps
      description: "If you are not using GuestPoint IDs for Rate Plans, implement this endpoint so GuestPoint can retrieve the codes used by your system. These codes will be used in all rate updates.\r\n"
      requestBody:
        $ref: '#/components/requestBodies/Get-RatePlanCodes'
  /roomcodes:
    post:
      summary: Get Room Type Codes
      tags:
        - Data requested from you
      responses:
        '200':
          $ref: '#/components/responses/Get-RoomTypeCodesResponse'
      operationId: get-roomcodes
      x-stoplight:
        id: q4pxgchx22zf3
      description: 'If you are not using GuestPoint IDs for Room Types, implement this endpoint so GuestPoint can retrieve the room type codes used by your system. These codes will be used in availability updates.'
      requestBody:
        $ref: '#/components/requestBodies/Get-RoomTypeCodes'
components:
  schemas:
    Property:
      type: object
      x-examples:
        Example 1:
          ID: 1ed82509-b260-613f-8bbd-edd06b16e222
          Name: Hilltops Retreat Motor Inn
          Description: 'Relaxed roadside lodging offering an outdoor saltwater pool, a restaurant & a bar, plus free Wi-Fi.'
