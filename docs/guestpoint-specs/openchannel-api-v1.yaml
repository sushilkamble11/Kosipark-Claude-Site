                      FromDate:
                        type: string
                      ToDate:
                        type: string
                  Rates:
                    type: object
                    properties:
                      RoomTypes:
                        type: array
                        items:
                          type: object
                          properties:
                            Id:
                              type: string
                      RatePlans:
                        type: array
                        items:
                          type: object
                          properties:
                            Id:
                              type: string
                      FromDate:
                        type: string
                      ToDate:
                        type: string
            x-examples:
              Example 1:
                Type:
                  Availability:
                    RoomTypes:
                      - Id: 4359a639-4f69-48e7-9f82-6d3b38dcb578
                    FromDate: '2024-06-14'
                    ToDate: '2024-06-15'
                  Rates:
                    RoomTypes:
                      - Id: 4359a639-4f69-48e7-9f82-6d3b38dcb578
                    RatePlans:
                      - Id: 7aeadcdc-c9cf-458f-8417-9d0002899d24
                    FromDate: '2024-06-14'
                    ToDate: '2024-06-15'
          examples:
