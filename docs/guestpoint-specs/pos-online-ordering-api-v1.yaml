      description: |-
        Update an existing order by:
        - adding more items and/or
        - completing payment of the order

        NOTE: 
         - Items cannot be added to an order if it already has a payment balance.
         - Items can only be added for Bill Types "Table" and "Room" 
      tags:
        - Ordering
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  CustomerId: 01GB4CMQD55N9PCJ7TPDTCBSRW
                  VendorOrderNumber: '1234567'
                  OrderTotal: '14.00'
                  TotalPaid: '0.00'
                  PaymentType: Card
                  OrderItems:
                    - StockCode: BT XXXX GOLD
                      Quantity: 2
                      PriceIncTax: '7.00'
                      ItemTotal: '14.00'
                      Modifiers: []
              properties:
                CustomerId:
                  type: string
                  description: The Customer Id from the Open Bill
                VendorOrderNumber:
                  type: string
                  description: The Integrators order number. Must be the same as the order being modified
                OrderTotal:
                  type: string
                TotalPaid:
                  type: string
                PaymentType:
                  type: string
                PaymentReference:
                  type: string
                OrderItems:
                  type: array
                  items:
                    type: object
                    properties:
                      StockCode:
                        type: string
                      Quantity:
                        type: integer
                      PriceIncTax:
                        type: string
                      ItemTotal:
                        type: string
                      Modifiers:
                        type: array
                        items:
                          type: object
              required:
                - CustomerId
                - VendorOrderNumber
                - OrderTotal
                - TotalPaid
                - PaymentType
            examples:
              example-1:
                value:
                  CustomerId: 01GB4CMQD55N9PCJ7TPDTCBSRW
                  VendorOrderNumber: '1234567'
                  OrderTotal: '14.00'
                  TotalPaid: '0.00'
                  PaymentType: Card
                  PaymentReference: AAVVBB
                  OrderItems:
                    - StockCode: BT XXXX GOLD
                      Quantity: 2
                      PriceIncTax: '7.00'
                      ItemTotal: '14.00'
                      Modifiers: []
              example-2:
                value:
                  CustomerId: 01GB4CMQD55N9PCJ7TPDTCBSRW
                  VendorOrderNumber: '1234567'
                  OrderTotal: '14.00'
                  TotalPaid: '27.00'
                  PaymentType: Card
                  OrderItems: []
        description: ''
