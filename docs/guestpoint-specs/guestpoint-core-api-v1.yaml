openapi: 3.1.0
x-stoplight:
  id: 7i11oq432ul7m
info:
  version: '1.0'
  title: GuestPoint API
  summary: GuestPoint API
  description: "This API allows third parties to integrate with the GuestPoint PMS for functionality related to Rooms and Guests.\r\n  \r\nCalls to the GuestPoint API endpoints require use of the X-API-KEY header.\r\n\r\nContact GuestPoint to discuss your integration requirements and get an API Key.\r\n"
  contact:
    name: Integrations Support
    email: integrations@guestpoint.com
servers: []
paths:
  /v2/ping:
    get:
      summary: Ping Check
      description: "Ping is a good place to start with integrations as it is a very simple call. \r\nIt can be used to test connectivity.\r\n\r\nThe x-api-key header must be set even for this function. The partner's backend key or a session key generated by the partner's key can be used."
      operationId: get-ping
      responses:
        '200':
          description: Shared Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    type: object
                    x-stoplight:
                      id: xwjav1df4e2uo
                    properties:
                      Version:
                        type: string
                        x-stoplight:
                          id: gkgv77ggsgwyh
                  Message:
                    type: string
                    x-stoplight:
                      id: wukmyjxipletz
                  Success:
                    type: boolean
                    x-stoplight:
                      id: 2q7m21m0e1co4
                  TraceId:
                    type: string
                    x-stoplight:
                      id: vc642m2owoiat
              examples:
                Example 1:
                  value:
                    Data:
                      Version: 0.1.0
                    Message: Pong
                    Success: true
                    TraceId: '12345'
        '401':
          description: Unauthorized
      x-stoplight:
        id: 78sqlw0rtu1uh
      security:
        - Api-Key: []
      parameters: []
    parameters: []
  /v1/accounts/addtransaction:
    post:
      summary: Add Transaction
      tags:
        - Accounts
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  IsSuccess:
                    type: boolean
                    x-stoplight:
                      id: 708hb2034escq
                  Message:
                    type: string
                    x-stoplight:
                      id: 9uohnk24tirfg
              examples:
                Failed Request - Incorrect Room Allocation ID:
                  value:
                    Message: No Data Found (Room Allocations)
                No Request Body:
                  value:
                    Message: A request body is required
                No Account ID:
                  value:
                    Message: An AccountID is required
                No Charges in Request:
                  value:
                    Message: Charges are required
                Wrong Room Allocation ID:
                  value:
                    Message: Room Allocation ID does not exist
        '401':
          description: Unauthorized
        2XX:
          $ref: '#/components/responses/AllocatedGuestTransactionResponse'
      operationId: post-v1-accounts-add-transaction
      x-stoplight:
        id: nfryn669rzqja
      description: Adds charges to the Account
      security:
        - Api-Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateGuestTransactionRequest'
            examples:
              Example 1:
                value:
                  RoomAllocationID: 2A17459C-60F5-4BE0-AF85-C88868F13AB1
                  AccountID: E94FA9A9-C2FF-4F71-9DE8-986963F19EC1
                  Charges:
                    - AmountIncl: 175
                      Description: Airport Transfer
                      TransactionAccountID: 8839B923-C887-4A60-8009-BFE82B85CA75
                    - AmountIncl: 65
                      Description: Restaurant
                      TransactionAccountID: A77E64E6-94ED-4A8B-B3CA-390AC5D24B03
                      ChargeToGuest: true
                    - AmountIncl: 45
                      Description: Room Charges
                      TransactionAccountID: 714C7437-7607-4E2E-AA82-1D30994C12A4
    parameters: []
  /v1/accounts/voidtransaction:
    post:
      summary: Void Transaction
      tags:
        - Accounts
      responses:
        '200':
          $ref: '#/components/responses/VoidedGuestTransactionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  IsSuccess:
                    type: boolean
                    x-stoplight:
                      id: dmj5oipdt1348
                  Message:
                    type: string
                    x-stoplight:
                      id: 8idq492hp338v
              examples:
                No Request or No Charges to Reverse:
                  value:
                    Message: Charges are required.
                No Reversal/s Transaction Item ID:
                  value:
                    Message: A TransactionItemID is required for each Transaction Item to be reversed.
                No Data:
                  value:
                    Message: No Data Found (Transaction)
        '401':
          description: Unauthorized
      operationId: post-v1-accounts-voidtransaction
      x-stoplight:
        id: ygab4pwmnz3ci
      security:
        - Api-Key: []
      requestBody:
        $ref: '#/components/requestBodies/VoidGuestTransactionRequest'
  /v1/guests:
    get:
      summary: Get Guest by Name
      tags:
        - Guests
      security:
        - Api-Key: []
      responses:
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
        2XX:
          $ref: '#/components/responses/GuestResponse'
      operationId: get-v1-guests
      x-stoplight:
        id: ku2eu45waxerr
      description: Gets the Guest Details from their name.
      requestBody:
        description: Shared Request
      parameters:
        - schema:
            type: string
          in: query
          name: lastName
          description: FirstName and LastName are the minimum required data on a Update Guest Request.
        - schema:
            type: string
          in: query
          name: firstName
          description: FirstName and LastName are the minimum required data on a Update Guest Request.
        - schema:
            type: string
          in: query
          name: email
        - schema:
            type: string
          in: query
          name: mobile
  '/v1/guests/{guestId}':
    get:
      tags:
        - Guests
      summary: Get Guest by ID
      operationId: get-v1-guests-guestId
      parameters:
        - name: guestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GuestResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: wt367e4pwtg8l
      requestBody:
        $ref: '#/components/requestBodies/GuestRequest'
      description: Get the Guest record based on their GUID
    put:
      tags:
        - Guests
      summary: Update Guest
      operationId: put-v1-guests-update-guest
      parameters:
        - name: guestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/GuestRequest'
      responses:
        '200':
          $ref: '#/components/responses/GuestResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: 7871b1myz3km5
    parameters:
      - schema:
          type: string
          format: uuid
        name: guestId
        in: path
        required: true
        description: The ID of the Guest
  /v1/guests/inhouse:
    get:
      summary: Get In-House Guests
      tags:
        - Guests
      responses:
        '200':
          $ref: '#/components/responses/InHouseResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      operationId: get-v1-guests-inhouse
      x-stoplight:
        id: 03j72tfl2njot
      security:
        - Api-Key: []
      description: 'Retrieves a list of Guests that are, or were booked to be, currently checked into the property'
      parameters: []
  /v1/kiosk/checkin:
    post:
      tags:
        - Kiosk
      summary: Checkin
      operationId: post-v1-kiosk-checkin
      requestBody:
        $ref: '#/components/requestBodies/CheckinRequest'
      responses:
        '200':
          $ref: '#/components/responses/CheckinResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: ricw4h7273edu
      parameters:
        - schema:
            type: string
          in: header
          name: Content-Type
          description: application/json
  /v1/kiosk/consent:
    post:
      tags:
        - Kiosk
      summary: Save Consent
      operationId: post-v1-kiosk-consent
      requestBody:
        $ref: '#/components/requestBodies/ConsentRequest'
      responses:
        '200':
          $ref: '#/components/responses/ConsentResponse'
        '400':
          $ref: '#/components/responses/ConsentResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: 2rtqkm9eujgci
      parameters:
        - schema:
            type: string
          in: header
          name: Content-Type
          description: application/json
  /v1/payments:
    post:
      tags:
        - Payments
      summary: Post Payment
      operationId: post-v1-payments
      requestBody:
        $ref: '#/components/requestBodies/PaymentRequest'
      responses:
        '200':
          $ref: '#/components/responses/PaymentResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: vlhxlv1wx2898
      parameters: []
    get:
      summary: Get Card Payment Details
      tags:
        - Payments
      responses:
        '200':
          $ref: '#/components/responses/AcceptedCardResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      operationId: get-v1-payments
      x-stoplight:
        id: drx1ts3k13gqq
      parameters:
        - schema:
            type: number
            format: float
          in: query
          name: amount
  '/v2/properties/{propertyId}':
    get:
      tags:
        - Properties
      summary: Get Property By ID
      operationId: get-v2-properties-propertyId
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/PropertyResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: 6gjtdswxou55m
    parameters:
      - schema:
          type: string
          format: uuid
        name: propertyId
        in: path
        required: true
        description: The ID of the Property
  /v1/reservations:
    get:
      summary: Get Reservation by Searching
      tags:
        - Reservations
      responses:
        '200':
          $ref: '#/components/responses/ReservationsCollectionResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      operationId: get-v1-reservations
      x-stoplight:
        id: seb3n17vc5vy5
      description: "The following query parameters are available for searching through the reservations.\r\n- email\r\n- lastName\r\n- bookingReference\r\n- arrivalFrom\r\n- arrivalTo\r\n\r\nUse each parameter individually, or combine multiple to provide finer control of the search.\r\n\r\nWhen using arrivalFrom or arrivalTo, you MUST additionally use either an email or lastName param.\r\n\r\nAlso remember dates are passed using ISO format. yyyy-mm-dd\r\n\r\n- /reservations?email={jane.doe@test.com}&arrivalFrom={2024-02-20}\r\n- /reservations?lastName={Doe}&arrivalFrom={25-02-2024}\r\n\r\nIt is typical to use both ArrivalFrom and ArrivalTo together for a more efficient Query.\r\n\r\n- /reservations?lastName={Doe}&arrivalFrom={20-02-2024}&arrivalTo={25-02-2024}"
      parameters:
        - schema:
            type: string
            format: email
          in: query
          name: email
          description: Email address
        - schema:
            type: string
          in: query
          name: lastName
          description: Last name of the customer to search for
        - schema:
            type: string
          in: query
          name: bookingReference
          description: The booking reference number
        - schema:
            type: string
            format: date
          in: query
          name: arrivalFrom
          description: 'The date to search from for arriving guests.  ISO format, yyyy-mm-dd'
        - schema:
            type: string
            format: date
          in: query
          name: arrivalTo
          description: 'The date to search to for arriving guests.  ISO format, yyyy-mm-dd'
  '/v2/reservations/{reservationId}':
    get:
      tags:
        - Reservations
      summary: Get Reservation by Reservation ID
      description: Retrieve the information of the Reservation with the matching Reservation ID.
      operationId: get-v1-reservations-reservationid
      parameters:
        - name: reservationId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Shared Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              examples:
                Example 1:
                  value:
                    PropertyId: 36dc6a07-78e6-4a37-9c20-6ed68e998542
                    ReservationId: 3e1a09c5-ef8c-44d0-a6ab-86b174adcea6
                    ReservationNumber: string
                    ArrivalDate: '2019-08-24'
                    DepartureDate: '2019-08-24'
                    Allocations:
                      - RoomAllocationId: 5dc366ee-ba0d-4a7b-8bd5-a61b90ce0363
                        GuestName: string
                        GuestFirstName: string
                        GuestLastName: string
                        GuestId: e5a670b7-d586-484f-95d5-ae652e9363b4
                        IsPrimary: true
                        ArrivalDate: '2019-08-24'
                        DepartureDate: '2019-08-24'
                        RoomId: a53d22d9-0e96-431b-adb6-4c7de0611ee5
                        Status: string
                        DoorNumber: string
                        GuestEmail: user@example.com
                        GuestPhone: string
                        CardNumbers: string
                        LockID: 00f7f2e1-fa81-4778-92b5-e9500410ac1c
                    AmountOutstanding: string
                    AmountRequired: string
                    CheckinAllRoomsTogether: true
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: snynvske7qcow
    parameters:
      - schema:
          type: string
          format: uuid
        name: reservationId
        in: path
        required: true
        description: The ID of the Reservation record
  '/v1/reservations?bookingReference={reference}':
    get:
      tags:
        - Reservations
      summary: Get Reservation by Booking Reference
      description: Retrieve the information of the references
      operationId: get-v1-reservations-refs
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ReservationsCollectionResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: 2d2n203q6ly3d
    parameters:
      - schema:
          type: string
        name: reference
        in: path
        required: true
        description: The booking reference for the client.
  '/v1/reservations?email={email}':
    get:
      tags:
        - Reservations
      summary: Get Reservation by Email
      description: Retrieve the information of the references
      operationId: get-v1-reservations-refs-email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ReservationsCollectionResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: tkih73qa378aa
    parameters:
      - schema:
          type: string
        name: email
        in: path
        required: true
      - schema:
          type: string
        in: query
        name: email
        description: The email address to filter on
  '/v1/reservations?lastName={lastName}':
    get:
      tags:
        - Reservations
      summary: Get Reservation by LastName
      description: Retrieve the information of the references
      operationId: get-v1-reservations-refs-lastname
      parameters:
        - name: lastName
          in: query
          description: LastName of Guest
          schema:
            type: string
        - name: lastName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ReservationsCollectionResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: 9gekwidp283lb
  '/v1/reservations?arrivalFrom={date}':
    get:
      tags:
        - Reservations
      summary: Get Reservation by Arrival date range
      description: "You MUST provide both arrivalFrom or arrivalTo query parameters. The email and lastName parameters will filter further.\r\n\r\nAlso remember dates are passed using ISO format. yyyy-mm-dd\r\n\r\n- /reservations?arrivalFrom={2026-02-20}&arrivalTo={2026-02-27}\r\n- /reservations?email={jane.doe@test.com}&arrivalFrom={2026-02-20}&arrivalTo={2026-02-27}\r\n- /reservations?lastName={Doe}&arrivalFrom={2026-02-20}&arrivalTo={2026-02-27}\r\n"
      operationId: get-v1-reservations-dates-from
      parameters:
        - name: arrivalFrom
          in: query
          description: Date to search Arrivals from
          schema:
            type: string
          required: true
        - name: date
          in: path
          description: 'ISO format, 2024-05-20  ( yyyy-mm-dd )'
          required: true
          schema:
            type: string
        - schema:
            type: string
          in: query
          name: lastName
          description: Last name to search for
        - schema:
            type: string
          in: query
          name: email
          description: Email address to search for
      responses:
        '200':
          $ref: '#/components/responses/ReservationsCollectionResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-stoplight:
        id: pm5imrwx9tpgn
  '/v1/reservations/changesFrom/{dateFrom}':
    parameters:
      - schema:
          type: string
          format: date
          minLength: 0
        name: dateFrom
        in: path
        description: The date to get data changes from.
        required: true
    get:
      summary: Get reservations with changed data
      tags:
        - Reservations
      responses:
        '200':
          $ref: '#/components/responses/ReservationsChangesFromResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      operationId: get-v1-reservations-changesFrom-dateFrom?
      x-stoplight:
        id: 8uj81uksty44x
      description: "Retrieves reservations who's records have changed since the passed in date.\r\nRemember dates are passed using ISO format. yyyy-mm-dd"
      parameters:
        - schema:
            type: boolean
          in: query
          name: includeAccountBalanceChanges
          allowEmptyValue: true
          description: Will retrieve records with Account Balance Changes also
  '/v1/roomallocations/{roomAllocationId}/accesscode':
    get:
      summary: Get Access Code by RoomAllocationID
      tags:
        - Room Allocations
      responses:
        '200':
          $ref: '#/components/responses/RoomAllocationAccessCodesResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      operationId: get-v1-roomallocations-roomAllocationId-accesscode
      x-stoplight:
        id: yfx0xkz4v0khn
      security:
        - Api-Key: []
      parameters: []
      description: Retrieves the Access Code for the Room Allocation
    parameters:
      - schema:
          type: string
          format: uuid
        name: roomAllocationId
        in: path
        required: true
        description: A GUID representing the Room Allocation record
    post:
      summary: Post Access Code for RoomAllocationID
      responses:
        '200':
          $ref: '#/components/responses/RoomAllocationAccessCodesResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Unauthorized
      operationId: post-v1-roomallocations-roomAllocationId-accesscode
      x-stoplight:
        id: su6fs8tt0x3ag
      security:
        - Api-Key: []
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/RoomAllocationAccessCodesRequest'
      tags:
        - Room Allocations
      description: Allows for the updating of the AccessCode for a particular Room Allocation.
  /v2/rooms:
    get:
      tags:
        - Rooms
      summary: Get Rooms
      operationId: get-v2-rooms
      responses:
        '200':
          $ref: '#/components/responses/RoomsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          description: Unauthorized
      security:
        - Api-Key: []
      x-internal: false
      x-stoplight:
        id: m7en297q2708x
      parameters: []
    parameters: []
  '/v2/rooms/{roomId}':
    get:
      tags:
        - Rooms
      summary: Get Room By Id
      operationId: get-v1-room-id
      parameters: []
      responses:
        '200':
          description: A single Room object
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    $ref: '#/components/schemas/Room_Concise'
                    x-stoplight:
                      id: 1l7ctw2ykwsgi
                  Success:
                    type: boolean
                    x-stoplight:
                      id: r2l5dp4t48blw
                  Message:
                    type: string
                    x-stoplight:
                      id: co0i9gk8q34c0
                    description: 'Optional Message. '
                  TraceId:
                    type: string
                    x-stoplight:
                      id: cld15dsm2h4tc
              examples:
                Example 1:
                  value:
                    Data:
                      RoomId: a53d22d9-0e96-431b-adb6-4c7de0611ee5
                      PropertyId: 36dc6a07-78e6-4a37-9c20-6ed68e998542
                      DoorNumber: '123'
                      RoomTypeId: 1a93d560-84a4-46f5-8f4f-96d8863aaa25
                      RoomType: Big Room
                      RoomStatus: Clean
                      RoomSequence: 0
                      KeyLockDoorName: A123
                    Success: true
                    TraceId: '12345'
        '400':
          $ref: '#/components/responses/ErrorResponse'
      security:
        - Api-Key: []
      x-internal: false
      x-stoplight:
        id: psaotip7dpgv9
    parameters:
      - schema:
          type: string
        name: roomId
        in: path
        required: true
      - schema:
          type: string
          format: uuid
        name: roomId
        in: path
        required: true
        description: A GUID representing the Room
  /v2/rooms/status:
    get:
      tags:
        - Rooms
      summary: Get Room Status
      operationId: get-v2-room-status
      parameters:
        - name: dateFrom
          in: query
          description: 'ISO format, yyyy-mm-dd'
          required: true
          schema:
            type: string
            format: date
            examples:
              - 'ISO format, 2024-05-20 ( yyyy-mm-dd )'
        - name: dateTo
          in: query
          description: '(Optional) ISO format, yyyy-mm-dd'
          schema:
            type: string
            format: date
        - name: includeOutOfService
          in: query
          schema:
            type: boolean
          description: 'Include Out-Of-Service rooms in the result. Defaults to true if not given. '
        - name: includeBookings
          in: query
          schema:
            type: boolean
          description: Include Checked-in rooms in the result. Defaults to true if not given.
      responses:
        '200':
          $ref: '#/components/responses/RoomsStatusResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          description: Unauthorized
      x-internal: false
      x-stoplight:
        id: xwhdbakodw017
      description: 'Retrieves the status of all the rooms for the property for a date range if given, or for just the dateFrom if not.'
