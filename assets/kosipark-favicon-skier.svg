<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Kosciuszko Tourist Park skier favicon</title>
  <desc id="desc">A skier descends a snowy mountain with a small trail of powder.</desc>
  <style>
    .skier {
      transform-origin: center;
      animation: ski-run 9s cubic-bezier(.42, 0, .26, 1) infinite;
    }
    .powder { animation: powder 9s ease-out infinite; }
    .flake { animation: snowfall 6s ease-in-out infinite; }
    .flake-two { animation-delay: -2s; }
    .flake-three { animation-delay: -4s; }
    @keyframes ski-run {
      0%, 55% { transform: translate(11px, 9px) rotate(5deg); opacity: 1; }
      58% { transform: translate(15px, 12px) rotate(7deg); opacity: 0; }
      59% { transform: translate(-7px, -6px) rotate(-5deg); opacity: 0; }
      63% { opacity: 1; }
      88%, 100% { transform: translate(11px, 9px) rotate(5deg); opacity: 1; }
    }
    @keyframes powder {
      0%, 64% { transform: translate(-5px, -4px) scale(.55); opacity: 0; }
      76% { opacity: .95; }
      89% { transform: translate(9px, 8px) scale(1); opacity: .72; }
      96%, 100% { transform: translate(11px, 9px) scale(1.08); opacity: 0; }
    }
    @keyframes snowfall {
      0%, 100% { transform: translateY(-2px); opacity: .35; }
      50% { transform: translateY(3px); opacity: .9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skier, .powder, .flake { animation: none; }
    }
  </style>

  <rect width="64" height="64" rx="15" fill="#193D34"/>

  <circle class="flake" cx="48" cy="12" r="1.5" fill="#F8F4EA"/>
  <circle class="flake flake-two" cx="54" cy="19" r="1.1" fill="#F8F4EA"/>
  <circle class="flake flake-three" cx="12" cy="19" r="1.3" fill="#F8F4EA"/>

  <path d="M5 45 24 17l9.5 13L42 21l17 24H5Z" fill="#F8F4EA"/>
  <path d="m5 45 19-28 9.5 13-5 6.4-6.2-7.6L11 45H5Z" fill="#ADC3AE"/>
  <path d="m28.5 36.4 5-6.4 8.5-9 17 24H44l-7-9-4.2 5.1-4.3-4.7Z" fill="#78957B"/>
  <path d="M5 45c11-2.8 21-2.8 31 0s16.5 2.8 23 0v11H5V45Z" fill="#F8F4EA"/>

  <g class="powder" fill="#F8F4EA">
    <circle cx="28" cy="39" r="2.2"/>
    <circle cx="24" cy="40.5" r="1.45" opacity=".85"/>
    <circle cx="21" cy="41" r=".9" opacity=".65"/>
  </g>

  <g class="skier" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="34" cy="27" r="2.25" fill="#C97836"/>
    <path d="m33.5 30 3.8 3.2-2.3 4" fill="none" stroke="#C97836" stroke-width="3"/>
    <path d="m35.7 32 5.8 3.3M35 36.7l4.7 3.2m-4.7-3.2-3 3.7" fill="none" stroke="#193D34" stroke-width="1.8"/>
    <path d="m40.8 33.8 3.5 8.3" fill="none" stroke="#193D34" stroke-width="1.15"/>
    <path d="M28.5 42.2c5.8 1.3 12.3.7 18-2" fill="none" stroke="#193D34" stroke-width="1.8"/>
  </g>
</svg>
